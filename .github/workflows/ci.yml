name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest flake8
      - run: python -m py_compile inference.py model/*.py tests/*.py
      - run: python -m flake8 inference.py model tests --select=E9,F
      - run: python -m pytest -q
